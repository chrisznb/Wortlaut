# Wortlaut - Cargo workspace root.
# Split mirrors WhimprFlow: a dependency-light `core` crate that owns the domain
# logic (and is therefore fast to test), plus a heavy `asr` crate that pulls in
# whisper.cpp and implements the trait declared in core.
[workspace]
resolver = "2"
members = [
    "crates/wortlaut-core",
    "crates/wortlaut-asr",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Wortlaut contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
