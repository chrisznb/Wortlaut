[package]
name = "wortlaut-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "wortlaut_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# whisper.cpp is a C++ build and by far the slowest part of a cold compile.
# Turning the feature off keeps the whole app compiling and the UI usable on a
# machine where it cannot be built; speech recognition then reports
# `asr_disabled` instead of running.
[features]
default = ["whisper"]
whisper = ["dep:wortlaut-asr"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wortlaut-core = { path = "../crates/wortlaut-core" }
wortlaut-asr = { path = "../crates/wortlaut-asr", optional = true }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
